name: Copilot setup steps
on:
  workflow_dispatch:
  pull_request:
    paths:
      - .github/workflows/copilot-setup-steps.yml
      - requirements-test.txt
      - requirements-tooling.txt
      - requirements-browser.txt
permissions:
  contents: read
jobs:
  copilot-setup-steps:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.14'
          check-latest: true
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '26'
          check-latest: true
      - name: Install HA-compatible development and browser dependencies
        run: python -m pip install -r requirements-test.txt -r requirements-browser.txt
      - name: Install Chromium headless shell for the browser suite
        run: python -m playwright install --with-deps --only-shell chromium
      - name: Verify the prepared tools and environment
        run: |
          python -m pip check
          ruff --version
          node --version
          python -c "import homeassistant, playwright; print('HA and Playwright imports succeeded')"
